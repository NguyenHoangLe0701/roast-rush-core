name: React Doctor Health Check

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'

concurrency:
  group: react-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: "Analyze React Performance, Security & Accessibility"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Frontend exists
        id: check_fe
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 20 (with cache)
        if: steps.check_fe.outputs.exists == 'true' && hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Node.js 20 (without cache fallback)
        if: steps.check_fe.outputs.exists == 'true' && hashFiles('frontend/package-lock.json') == ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        if: steps.check_fe.outputs.exists == 'true'
        working-directory: ./frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run React Doctor Audit on ./frontend
        if: steps.check_fe.outputs.exists == 'true'
        uses: millionco/react-doctor@v2
        with:
          directory: ./frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
