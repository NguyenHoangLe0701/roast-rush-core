name: React Doctor Health Check

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'

concurrency:
  group: react-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: "Analyze React Performance, Security & Accessibility"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run React Doctor Audit on ./frontend
        uses: millionco/react-doctor@v2
        with:
          directory: ./frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

