name: k6 High-Concurrency Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to run load test against (leave default to test local frontend preview)'
        required: false
        default: 'http://localhost:4173'
      vus:
        description: 'Peak Virtual Users (VUs)'
        required: false
        default: '30'

jobs:
  k6-load-test:
    name: "Run k6 Load Test & Export Report"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (For Local Target Server if testing localhost)
        if: contains(inputs.target_url, 'localhost') || inputs.target_url == ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Start Local Target Server (Port 4173)
        if: contains(inputs.target_url, 'localhost') || inputs.target_url == ''
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --host 0.0.0.0 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..15}; do
            if curl -sSf http://localhost:4173 >/dev/null; then
              echo "Local server is up on http://localhost:4173"
              break
            fi
            sleep 1
          done

      - name: Setup Grafana k6 CLI
        uses: grafana/setup-k6-action@v1

      - name: Execute k6 Load Test Script
        env:
          TARGET_URL: ${{ inputs.target_url || 'http://localhost:4173' }}
          PEAK_VUS: ${{ inputs.vus || '30' }}
        run: k6 run k6/load-test.js

      - name: Upload k6 Load Test Report (report.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-report
          path: report.json
          retention-days: 14

