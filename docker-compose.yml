version: '3.8'

services:
  # ==========================================
  # 1. DATABASE: MySQL 8.0
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: roastrush-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-roastrush_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-roast_rush_db}
      MYSQL_USER: ${MYSQL_USER:-roastrush_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-roastrush_pass_2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roastrush-net

  # ==========================================
  # 2. DISTRIBUTED CACHE & LOCK: Redis 7.2
  # (Keyspace Notifications enabled for 15m TTL expiration)
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: roastrush-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # notify-keyspace-events Ex: cho phép lắng nghe sự kiện key hết hạn (expired) để phối hợp với Kafka release stock
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-roastrush_redis_2026}
      --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-roastrush_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roastrush-net

  # ==========================================
  # 3. EVENT BROKER: Apache Kafka (KRaft Mode - No Zookeeper)
  # ==========================================
  kafka:
    image: bitnami/kafka:3.7
    container_name: roastrush-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners: INTERNAL cho Docker network, EXTERNAL cho Spring Boot chạy trên máy host (localhost:9092)
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Auto create topics & Retention
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - roastrush-net

  # ==========================================
  # 4. KAFKA UI (Tiện theo dõi Event & Delay Queue khi dev)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: roastrush-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: roastrush-local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - roastrush-net

volumes:
  mysql_data:
  redis_data:
  kafka_data:

networks:
  roastrush-net:
    driver: bridge

